name: release-candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Unsigned candidate version
        required: true
        type: string
      source_date_epoch:
        description: Non-negative Unix timestamp used for deterministic SBOM and ZIP timestamps
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    environment: release-candidate
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Build unsigned portable candidate
        shell: pwsh
        env:
          SOURCE_DATE_EPOCH: ${{ inputs.source_date_epoch }}
          VERSION_INPUT: ${{ inputs.version }}
        run: ./eng/publish.ps1 -Runtime win-x64 -Version $env:VERSION_INPUT -OutputDirectory artifacts/release-candidate
      - name: Verify candidate package
        shell: pwsh
        run: ./eng/verify-package.ps1 -PackageDirectory artifacts/release-candidate/package
      - name: Upload unsigned candidate
        uses: actions/upload-artifact@v4
        with:
          name: lacertae-win-x64-${{ inputs.version }}
          path: artifacts/release-candidate
          if-no-files-found: error
